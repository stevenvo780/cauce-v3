# New alert group for the metrics defined in ops/observability/agent-health-metrics.prom.
#
# NOT wired into Prometheus yet: ops/observability/prometheus.yaml currently loads a single file
#   rule_files: [/etc/prometheus/alerts.yaml]
# To activate this group, either (a) append these groups into the existing alerts.yaml, or
# (b) change rule_files to a glob (e.g. "/etc/prometheus/alerts*.yaml") and ship this as a second
# file. Left as a separate file here on purpose so it's reviewable independently of the 18
# existing, already-tuned rules.
#
# Design notes shared by every ratio/rate rule below (why they look the way they do):
#   - cauce_dispatcher_delivery_terminal_total and cauce_dispatcher_delivery_timeout_total are
#     TRUE monotonic counters (exact `count(*)` over an append-only table, recomputed by SQL each
#     scrape) — unlike cauce_dispatcher_jobs_processed_total (in-memory, resets on dispatcher
#     restart today), increase()/rate() over these is safe across dispatcher restarts.
#   - Every ratio alert is guarded with `and <denominator-or-count> >= N` so a quiet alias/lane
#     cannot divide-by-near-zero into a false +Inf/100% alert (Prometheus `and` keeps only the LHS
#     series that have a matching, truthy RHS series — this is the standard multi-window/volume-floor
#     idiom, same shape as e.g. Kubernetes SLO mixins).
#   - Failure-rate and timeout alerts each ship as a FAST pair (short window, higher bar — a burst)
#     and a SLOW pair (long window, lower bar — a sustained trend, this is what would have caught the
#     "12% over 7 days" and "29 timeouts over 7 days" incidents specifically).
#   - The 120s/1800s/etc absolute thresholds are first-pass, conservative starting points — there is
#     no historical baseline yet. Tighten or loosen them after ~1-2 weeks of real data; the `for:`
#     durations are chosen to survive one scrape/eval hiccup (15s interval) without over-damping.

groups:
  - name: cauce-v3-agent-health-outcomes
    rules:
      - alert: CauceAliasDeliveryFailureRateBurst
        expr: |
          (
            sum by (alias) (increase(cauce_dispatcher_delivery_terminal_total{status=~"failed|dead"}[1h]))
            /
            sum by (alias) (increase(cauce_dispatcher_delivery_terminal_total[1h]))
          ) > 0.25
          and
          sum by (alias) (increase(cauce_dispatcher_delivery_terminal_total[1h])) >= 5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Alias {{ $labels.alias }} has a high delivery failure rate in the last hour"

      - alert: CauceAliasDeliveryFailureRateSustained
        expr: |
          (
            sum by (alias) (increase(cauce_dispatcher_delivery_terminal_total{status=~"failed|dead"}[24h]))
            /
            sum by (alias) (increase(cauce_dispatcher_delivery_terminal_total[24h]))
          ) > 0.10
          and
          sum by (alias) (increase(cauce_dispatcher_delivery_terminal_total[24h])) >= 20
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Alias {{ $labels.alias }} has a sustained >10% delivery failure rate over 24h"

  - name: cauce-v3-agent-health-timeouts
    rules:
      - alert: CauceDeliveryTimeoutBurst
        expr: sum by (alias, kind) (increase(cauce_dispatcher_delivery_timeout_total[15m])) >= 3
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Alias {{ $labels.alias }} hit {{ $labels.kind }} timeouts repeatedly within 15 minutes"

      - alert: CauceDeliveryTimeoutAccumulating
        expr: sum by (alias, kind) (increase(cauce_dispatcher_delivery_timeout_total[24h])) >= 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Alias {{ $labels.alias }} is accumulating {{ $labels.kind }} timeouts over 24h"

  - name: cauce-v3-agent-health-connection-churn
    rules:
      - alert: CauceAliasEpochChurnWarning
        expr: changes(cauce_dispatcher_connection_lease_epoch[1h]) >= 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Alias {{ $labels.alias }} reconnected without resuming its session 3+ times in an hour"

      - alert: CauceAliasEpochChurnCritical
        expr: changes(cauce_dispatcher_connection_lease_epoch[20m]) >= 3
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Alias {{ $labels.alias }} is crash-looping: 3+ forced reconnects within 20 minutes"

      - alert: CauceAliasOffline
        expr: cauce_dispatcher_connection_lease_online == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Alias {{ $labels.alias }} has no live connection lease"

      - alert: CauceAliasOfflineLong
        expr: cauce_dispatcher_connection_lease_online == 0
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "Alias {{ $labels.alias }} has been offline for 30+ minutes"

  - name: cauce-v3-agent-health-latency
    rules:
      - alert: CauceInteractiveLatencyDegraded
        expr: |
          cauce_dispatcher_delivery_latency_seconds{lane="interactive",quantile="0.95"} > 120
          and
          cauce_dispatcher_delivery_latency_sample_count{lane="interactive"} >= 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Interactive lane p95 end-to-end latency exceeds 120s"

      - alert: CauceBatchLatencyDegraded
        expr: |
          cauce_dispatcher_delivery_latency_seconds{lane="batch",quantile="0.95"} > 1800
          and
          cauce_dispatcher_delivery_latency_sample_count{lane="batch"} >= 5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Batch lane p95 end-to-end latency exceeds 30 minutes"
