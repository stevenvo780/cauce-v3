map $request $cauce_device_safe_request {
  default $request;
  ~*(dispositivo|/v3/auth/device|[?&](user_|device_)?code=) "[device authorization]";
}
log_format cauce_console_safe '$remote_addr - $remote_user [$time_local] "$cauce_device_safe_request" '
  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  access_log /var/log/nginx/access.log cauce_console_safe;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # xterm writes element style attributes for measured cell geometry. Keep
  # style elements self-only and allow only style attributes (not scripts).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws: wss:; worker-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

  # Mismo match exacto que el target TLS de producción, sin mTLS porque el stack
  # de dev trabaja en claro. Ver deploy/nginx-console-tls.conf.
  location = /v3/console/terminal/ws {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $cauce_terminal_relay terminal-relay;
    proxy_pass http://$cauce_terminal_relay:8446;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  location ~ "^/v3/console/provider-auth/sessions/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/stream$" {
    access_log off;
    error_log /dev/null emerg;
    proxy_pass http://gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header Origin $http_origin;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization "";
    proxy_set_header X-Cauce-Operator "";
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_buffering off;
    proxy_next_upstream off;
  }

  location /v3/ws {
    proxy_pass http://gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  location ~ ^/v3/console/spaces/[^/]+/[^/]+/backups/[^/]+/download$ {
    proxy_pass http://gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering off;
  }

  # Provider sign-in verification runs the host's authenticate step (up to 150 s) inside the request.
  location ~ "^/v3/console/provider-auth/sessions/[0-9a-f-]{36}/verify$" {
    proxy_pass http://gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 360s;
    proxy_send_timeout 360s;
  }

  location ^~ /v3/auth/device {
    access_log off;
    error_log /dev/null emerg;
    proxy_pass http://gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /v3/ {
    proxy_pass http://gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location ^~ /dispositivo {
    access_log off;
    error_log /dev/null emerg;
    expires -1;
    try_files /index.html =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
