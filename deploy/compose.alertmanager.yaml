# Always apply with compose.yaml + compose.postgres.yaml; never alone.

services:
  alertmanager:
    profiles: [observability]
    image: ${CAUCE_ALERTMANAGER_IMAGE:?set an immutable CAUCE_ALERTMANAGER_IMAGE digest}
    user: "${CAUCE_ALERTMANAGER_UID:?set the provisioned non-root uid}:${CAUCE_ALERTMANAGER_GID:?set the provisioned non-root gid}"
    restart: always
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yaml"
      - "--storage.path=/alertmanager"
    volumes:
      - type: bind
        source: ${CAUCE_ALERTMANAGER_CONFIG_PATH:?set the tracked identity-free Alertmanager config}
        target: /etc/alertmanager/alertmanager.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CAUCE_ALERTMANAGER_DATA_DIR:?set a private persistent Alertmanager data directory}
        target: /alertmanager
        bind:
          create_host_path: false
    secrets:
      - source: alertmanager_telegram_token
        target: alertmanager_telegram_token
        uid: "${CAUCE_ALERTMANAGER_UID}"
        gid: "${CAUCE_ALERTMANAGER_GID}"
        mode: 0400
      - source: alertmanager_telegram_chat_id
        target: alertmanager_telegram_chat_id
        uid: "${CAUCE_ALERTMANAGER_UID}"
        gid: "${CAUCE_ALERTMANAGER_GID}"
        mode: 0400
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9093/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 8
    networks: [backend]

secrets:
  alertmanager_telegram_token:
    file: ${CAUCE_ALERTMANAGER_TELEGRAM_TOKEN_PATH:?set CAUCE_ALERTMANAGER_TELEGRAM_TOKEN_PATH}
  alertmanager_telegram_chat_id:
    file: ${CAUCE_ALERTMANAGER_TELEGRAM_CHAT_ID_PATH:?set CAUCE_ALERTMANAGER_TELEGRAM_CHAT_ID_PATH}
