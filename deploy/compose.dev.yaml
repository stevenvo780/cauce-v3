name: ${COMPOSE_PROJECT_NAME:-cauce-v3-dev}

x-dev-runtime: &dev-runtime
  image: ${CAUCE_RUNTIME_IMAGE:-cauce-v3-runtime:dev}
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    target: runtime
  user: "1000:1000"
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  stop_grace_period: 30s

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the private dev env}
    volumes:
      - cauce_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" && test \"$$(psql -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -Atqc 'SELECT 1')\" = 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [backend]
    stop_grace_period: 30s

  migrator:
    <<: *dev-runtime
    restart: "no"
    command: ["node", "deploy/migrate.mjs"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in the private dev env}
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  gateway:
    <<: *dev-runtime
    command: ["node", "services/gateway/dist/main.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in the private dev env}
      NODE_ENV: development
      CAUCE_DEV_AUTH: "1"
      CAUCE_ACK_DEADLINE_MS: ${CAUCE_ACK_DEADLINE_MS:-600000}
      CAUCE_TERMINAL_ENABLED: ${CAUCE_TERMINAL_ENABLED:-1}
      CAUCE_TERMINAL_WS_PATH: ${CAUCE_TERMINAL_WS_PATH:-/v3/console/terminal/ws}
      CAUCE_TERMINAL_GRANTS_FILE: /run/cauce-terminal/grants.json
      # Dev has no `secrets:` block; ticket key and shared token live in the
      # working directory, never in the repo.
      CAUCE_TERMINAL_TICKET_KEY_FILE: /run/cauce-terminal/ticket.key
      CAUCE_TERMINAL_RELAY_TOKEN_FILE: /run/cauce-terminal/relay.token
      CAUCE_TERMINAL_TICKET_TTL_SECONDS: "30"
      CAUCE_TERMINAL_SESSION_TTL_SECONDS: "900"
      CAUCE_TERMINAL_MAX_SESSIONS_PER_OPERATOR: "2"
      CAUCE_TERMINAL_OPERATOR_HEADER: x-cauce-operator
      CAUCE_TERMINAL_OPERATORS: ${CAUCE_TERMINAL_OPERATORS:-}
      PORT: "8080"
    volumes:
      # Must be a directory, not a file: grants.json is rotated via atomic
      # rename. See compose.yaml for the full note.
      - type: bind
        source: ${CAUCE_TERMINAL_CONFIG_DIR:-/dev/null}
        target: /run/cauce-terminal
        read_only: true
    ports: ["${CAUCE_DEV_BIND_IP:-127.0.0.1}:${GATEWAY_PORT:-8080}:8080"]
    healthcheck:
      test: ["CMD", "node", "deploy/readiness-probe.mjs", "http://127.0.0.1:8080/health/ready", "ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      migrator:
        condition: service_completed_successfully
    networks: [edge, backend]

  dispatcher:
    <<: *dev-runtime
    command: ["node", "services/dispatcher/dist/main.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in the private dev env}
      NODE_ENV: development
      PORT: "8082"
      DISPATCHER_POLL_MS: ${DISPATCHER_POLL_MS:-100}
      CAUCE_ACK_DEADLINE_MS: ${CAUCE_ACK_DEADLINE_MS:-600000}
      ACK_TIMEOUT_MS: ${ACK_TIMEOUT_MS:-600000}
      INTERACTIVE_BURST: ${INTERACTIVE_BURST:-3}
    healthcheck:
      test: ["CMD", "node", "deploy/readiness-probe.mjs", "http://127.0.0.1:8082/health/ready", "ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      migrator:
        condition: service_completed_successfully
    networks: [backend]

  terminal-relay:
    <<: *dev-runtime
    profiles: [terminal]
    command: ["node", "services/terminal-relay/dist/main.js"]
    environment:
      NODE_ENV: development
      CAUCE_DEV_AUTH: "1"
      CAUCE_TERMINAL_RELAY_BROWSER_PORT: "8446"
      CAUCE_TERMINAL_RELAY_AGENT_PORT: "8445"
      CAUCE_TERMINAL_RELAY_AGENT_REGISTRY_FILE: /run/cauce-terminal/pty_agent_identities.json
      # All four are mandatory; the process refuses to start without them. In
      # dev they may point to a self-signed cert used as server and CA for both legs.
      CAUCE_TERMINAL_RELAY_TLS_CERT_FILE: /run/cauce-terminal/relay.crt
      CAUCE_TERMINAL_RELAY_TLS_KEY_FILE: /run/cauce-terminal/relay.key
      CAUCE_TERMINAL_RELAY_CLIENT_CA_FILE: /run/cauce-terminal/relay.crt
      CAUCE_TERMINAL_RELAY_AGENT_CA_FILE: /run/cauce-terminal/relay.crt
      CAUCE_TERMINAL_RELAY_CONSOLE_CN: ${CAUCE_TERMINAL_CONSOLE_CN:-localhost}
      # HTTPS required: gatewayUrl() rejects any other scheme.
      CAUCE_TERMINAL_GATEWAY_URL: https://gateway:8443
      CAUCE_TERMINAL_RELAY_TOKEN_FILE: /run/cauce-terminal/relay.token
      CAUCE_TERMINAL_IDLE_TIMEOUT_SECONDS: "600"
      CAUCE_TERMINAL_OUTPUT_RATE_BYTES_PER_SEC: "262144"
      CAUCE_TERMINAL_SCROLLBACK_BYTES: "20480"
      CAUCE_TERMINAL_MAX_SESSIONS: "16"
      CAUCE_TERMINAL_AUTHZ_INTERVAL_SECONDS: "30"
      CAUCE_TERMINAL_AUTHZ_GRACE_SECONDS: "90"
    volumes:
      - type: bind
        source: ${CAUCE_TERMINAL_CONFIG_DIR:-/dev/null}
        target: /run/cauce-terminal
        read_only: true
    ports:
      # Both legs are published: agent leg to run a PTY agent outside compose,
      # browser leg to test the relay without the console.
      - "${CAUCE_DEV_BIND_IP:-127.0.0.1}:${TERMINAL_RELAY_AGENT_PORT:-8445}:8445"
      - "${CAUCE_DEV_BIND_IP:-127.0.0.1}:${TERMINAL_RELAY_BROWSER_PORT:-8446}:8446"
    depends_on:
      gateway:
        condition: service_healthy
    networks: [edge]

  console:
    image: ${CAUCE_CONSOLE_IMAGE:-cauce-v3-console:dev}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: console-dev
      args:
        VITE_CAUCE_API_BASE: ""
        VITE_CAUCE_DEV_AUTH: "1"
        VITE_CAUCE_DEV_TENANT: ${CAUCE_CONSOLE_TENANT:-Steven}
        VITE_CAUCE_DEV_ALIAS: ${CAUCE_CONSOLE_ALIAS:-kant}
    user: "101:101"
    restart: unless-stopped
    ports: ["${CAUCE_DEV_BIND_IP:-127.0.0.1}:${CONSOLE_PORT:-8081}:8080"]
    depends_on:
      gateway:
        condition: service_healthy
    networks: [edge]
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  fake-isa:
    <<: *dev-runtime
    command: ["node", "packages/adapter-sdk/dist/src/bin/fake.js"]
    environment:
      CAUCE_TENANT: Isa
      CAUCE_ALIAS: salva
      CAUCE_INSTANCE_ID: compose-dev-fake-isa
      CAUCE_STATE_DIR: /var/lib/cauce-adapter
      CAUCE_RELAY_URL: ws://gateway:8080/v3/ws
      CAUCE_ENVIRONMENT: development
      CAUCE_DEV_AUTH: "1"
      CAUCE_HARNESS_COMMAND: /app/packages/adapter-sdk/dist/src/bin/fake-harness.js
    volumes: [fake_isa_state:/var/lib/cauce-adapter]
    healthcheck:
      test: ["CMD-SHELL", "test -s /var/lib/cauce-adapter/fencing.json && kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      gateway:
        condition: service_healthy
    networks: [backend]

  fake-jhon:
    <<: *dev-runtime
    command: ["node", "packages/adapter-sdk/dist/src/bin/fake.js"]
    environment:
      CAUCE_TENANT: Jhon
      CAUCE_ALIAS: hegel
      CAUCE_INSTANCE_ID: compose-dev-fake-jhon
      CAUCE_STATE_DIR: /var/lib/cauce-adapter
      CAUCE_RELAY_URL: ws://gateway:8080/v3/ws
      CAUCE_ENVIRONMENT: development
      CAUCE_DEV_AUTH: "1"
      CAUCE_HARNESS_COMMAND: /app/packages/adapter-sdk/dist/src/bin/fake-harness.js
    volumes: [fake_jhon_state:/var/lib/cauce-adapter]
    healthcheck:
      test: ["CMD-SHELL", "test -s /var/lib/cauce-adapter/fencing.json && kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      gateway:
        condition: service_healthy
    networks: [backend]

  telegram-bridge:
    <<: *dev-runtime
    profiles: [telegram]
    command: ["node", "services/telegram-bridge/dist/main.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in the private dev env}
      NODE_ENV: development
      CAUCE_TELEGRAM_CONFIG_FILE: /run/cauce-telegram/config.json
      CAUCE_TELEGRAM_ALIASES: ${CAUCE_TELEGRAM_ALIASES:-}
      PORT: "8086"
    volumes:
      - type: bind
        source: ${CAUCE_TELEGRAM_RUNTIME_DIR:-/dev/null}
        target: /run/cauce-telegram
        read_only: true
    healthcheck:
      test: ["CMD", "node", "deploy/readiness-probe.mjs", "http://127.0.0.1:8086/health/ready", "ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      migrator:
        condition: service_completed_successfully
    networks: [backend]

volumes:
  cauce_pgdata:
  fake_isa_state:
  fake_jhon_state:

networks:
  edge:
  backend:
    internal: true
