name: ${COMPOSE_PROJECT_NAME:-cauce-v3-prod}

x-runtime-service: &runtime-service
  image: ${CAUCE_RUNTIME_IMAGE:?set an immutable CAUCE_RUNTIME_IMAGE digest}
  user: "1000:1000"
  # `unless-stopped` preserves crash recovery but makes an authenticated bridge
  # stop durable across Docker daemon and host restarts.
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  stop_grace_period: 45s
  entrypoint: ["/app/deploy/runtime-entrypoint.sh"]

x-runtime-secrets: &runtime-secrets
  - source: database_url
    target: database_url
    uid: "1000"
    gid: "1000"
    mode: 0400
  - source: postgres_ca
    target: postgres_ca
    uid: "1000"
    gid: "1000"
    mode: 0444

services:
  migrator:
    <<: *runtime-service
    restart: "no"
    command: ["node", "deploy/migrate.mjs"]
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      NODE_ENV: production
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /run/secrets/postgres_ca
    secrets: *runtime-secrets
    networks: [backend]

  gateway:
    <<: *runtime-service
    command: ["node", "services/gateway/dist/main.js"]
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      NODE_ENV: production
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /run/secrets/postgres_ca
      CAUCE_DEV_AUTH: "0"
      CAUCE_AUTH_PROVIDER: ${CAUCE_AUTH_PROVIDER:?select password, oidc, mtls, or token-file}
      # Login humano por correo + contraseña (tabla console_users). Sólo se lee cuando
      # CAUCE_AUTH_PROVIDER=password; mientras tanto el secreto apunta a /dev/null y el gateway
      # arranca exactamente como hoy. El fallback decide QUIÉN atiende lo que no trae cookie de
      # consola: `mtls` deja a los agentes entrando por su certificado igual que siempre.
      CAUCE_CONSOLE_JWT_KEY_FILE: /run/secrets/console_jwt_key
      CAUCE_CONSOLE_PASSWORD_FALLBACK: ${CAUCE_CONSOLE_PASSWORD_FALLBACK:-mtls}
      CAUCE_CONSOLE_SESSION_TTL_SECONDS: ${CAUCE_CONSOLE_SESSION_TTL_SECONDS:-28800}
      CAUCE_OIDC_ISSUER: ${CAUCE_OIDC_ISSUER:-}
      CAUCE_OIDC_AUDIENCE: ${CAUCE_OIDC_AUDIENCE:-}
      CAUCE_OIDC_JWKS_URL: ${CAUCE_OIDC_JWKS_URL:-}
      CAUCE_OIDC_AUTHORIZATION_URL: ${CAUCE_OIDC_AUTHORIZATION_URL:-}
      CAUCE_OIDC_TOKEN_URL: ${CAUCE_OIDC_TOKEN_URL:-}
      CAUCE_OIDC_CLIENT_ID: ${CAUCE_OIDC_CLIENT_ID:-}
      CAUCE_OIDC_REDIRECT_URI: ${CAUCE_OIDC_REDIRECT_URI:-}
      CAUCE_OIDC_POST_LOGIN_PATH: ${CAUCE_OIDC_POST_LOGIN_PATH:-/}
      CAUCE_OIDC_SESSION_KEY_FILE: /run/secrets/gateway_oidc_session_key
      CAUCE_OIDC_CLIENT_SECRET_FILE: ${CAUCE_OIDC_CLIENT_SECRET_CONTAINER_FILE:-}
      # Identity registries are re-read on every request, so they must resolve through the
      # directory bind below and never through a single-file secret mount. See the volumes block.
      CAUCE_TOKEN_HASH_FILE: /run/cauce-identities/token_hashes.json
      CAUCE_MTLS_IDENTITY_FILE: /run/cauce-identities/mtls_identities.json
      CAUCE_TLS_CERT_FILE: /run/secrets/gateway_tls_cert
      CAUCE_TLS_KEY_FILE: /run/secrets/gateway_tls_key
      CAUCE_TLS_CLIENT_CA_FILE: /run/secrets/gateway_client_ca
      CAUCE_HEALTH_PORT: "8081"
      CAUCE_CONSOLE_ORIGINS: ${CAUCE_CONSOLE_ORIGINS:?set exact HTTPS console origins}
      CAUCE_REQUIRE_ACK_CLAIMS: "1"
      CAUCE_ACK_DEADLINE_MS: ${CAUCE_ACK_DEADLINE_MS:-600000}
      # Sin declararla aqui, la variable de prod.env NO llega al contenedor (el ancla
      # no usa env_file) y el codigo cae a su default de 12 h. gateway y dispatcher
      # deben leer el mismo valor: uno escribe el plazo, el otro lo cobra.
      CAUCE_DELIVERY_LEASE_CAP_MS: ${CAUCE_DELIVERY_LEASE_CAP_MS:-21600000}
      CAUCE_MAX_INFLIGHT_DELIVERIES: ${CAUCE_MAX_INFLIGHT_DELIVERIES:-2}
      CAUCE_HUMAN_RESERVED_DELIVERIES: ${CAUCE_HUMAN_RESERVED_DELIVERIES:-2}
      CAUCE_MEDIA_DIR: /run/cauce-media
      CAUCE_MEDIA_MAX_BYTES: ${CAUCE_MEDIA_MAX_BYTES:-20971520}
      CAUCE_MEDIA_SWEEP_SECONDS: ${CAUCE_MEDIA_SWEEP_SECONDS:-60}
      CAUCE_TERMINAL_ENABLED: ${CAUCE_TERMINAL_ENABLED:-0}
      CAUCE_TERMINAL_WS_PATH: ${CAUCE_TERMINAL_WS_PATH:-/v3/console/terminal/ws}
      CAUCE_TERMINAL_TICKET_KEY_FILE: /run/secrets/terminal_ticket_key
      CAUCE_TERMINAL_RELAY_TOKEN_FILE: /run/secrets/terminal_relay_token
      # Gateway -> terminal-relay is a separate mTLS client leg from
      # terminal-relay -> gateway.  The server certificate cannot be reused:
      # production certificates carry explicit serverAuth/clientAuth EKUs.
      CAUCE_TERMINAL_RELAY_URL: ${CAUCE_TERMINAL_RELAY_URL:-}
      CAUCE_TERMINAL_RELAY_CA_FILE: /run/secrets/gateway_tls_ca
      CAUCE_TERMINAL_RELAY_CLIENT_CERT_FILE: /run/secrets/gateway_relay_client_cert
      CAUCE_TERMINAL_RELAY_CLIENT_KEY_FILE: /run/secrets/gateway_relay_client_key
      # SHA-256 of the terminal-relay -> gateway mTLS leaf DER. The gateway recomputes it from
      # the peer certificate; an empty/mismatched release pin keeps the PTY plane closed.
      CAUCE_TERMINAL_RELAY_INSTANCE_ID: ${CAUCE_TERMINAL_RELAY_INSTANCE_ID:?64 hex - sha256 del DER del leaf mTLS del relay}
      CAUCE_TERMINAL_GRANTS_FILE: /run/cauce-terminal/grants.json
      CAUCE_TERMINAL_TICKET_TTL_SECONDS: "30"
      CAUCE_TERMINAL_SESSION_TTL_SECONDS: "900"
      # Gateway and relay must agree exactly; both reject rollout skew instead of silently using
      # different takeover deadlines.
      CAUCE_TERMINAL_CLAIM_LEASE_SECONDS: "150"
      CAUCE_TERMINAL_MAX_SESSIONS_PER_OPERATOR: "2"
      CAUCE_TERMINAL_OPERATOR_HEADER: x-cauce-operator
      CAUCE_TERMINAL_OPERATORS: ${CAUCE_TERMINAL_OPERATORS:-}
      NODE_EXTRA_CA_CERTS: /run/secrets/gateway_tls_ca
      PORT: "8443"
    secrets:
      - source: database_url
        target: database_url
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: postgres_ca
        target: postgres_ca
        uid: "1000"
        gid: "1000"
        mode: 0444
      - source: gateway_tls_cert
        target: gateway_tls_cert
        uid: "1000"
        gid: "1000"
        mode: 0444
      - source: gateway_tls_key
        target: gateway_tls_key
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: gateway_tls_ca
        target: gateway_tls_ca
        uid: "1000"
        gid: "1000"
        mode: 0444
      - source: gateway_client_ca
        target: gateway_client_ca
        uid: "1000"
        gid: "1000"
        mode: 0444
      - source: gateway_oidc_session_key
        target: gateway_oidc_session_key
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: console_jwt_key
        target: console_jwt_key
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: gateway_oidc_client_secret
        target: gateway_oidc_client_secret
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: terminal_ticket_key
        target: terminal_ticket_key
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: terminal_relay_token
        target: terminal_relay_token
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: gateway_relay_client_cert
        target: gateway_relay_client_cert
        uid: "1000"
        gid: "1000"
        mode: 0444
      - source: gateway_relay_client_key
        target: gateway_relay_client_key
        uid: "1000"
        gid: "1000"
        mode: 0400
    volumes:
      # Compose file secrets are single-file bind mounts, and a single-file bind pins the inode it
      # was created from. mtls_identities.json and token_hashes.json are the only secrets the
      # gateway re-reads on every request, and both are rotated by atomic rename, which allocates a
      # NEW inode: mounted as files the container would keep serving the pre-rotation registry
      # forever, so neither an alta nor a revocation would ever reach the gateway. Mounting the
      # parent directory makes the rename visible because each read re-resolves the name.
      # This directory must hold ONLY those two registries: everything inside it is readable by the
      # gateway. Do not mount /etc/cauce-v3/secrets itself (that would newly expose the relay
      # provider module, the PostgreSQL password and any future secret) and do not leave rotation
      # backups inside it (keep them outside the mount).
      - type: bind
        source: ${CAUCE_GATEWAY_IDENTITY_DIR:?set CAUCE_GATEWAY_IDENTITY_DIR to the directory that holds mtls_identities.json and token_hashes.json}
        target: /run/cauce-identities
        read_only: true
        bind:
          create_host_path: false
      # Bind de DIRECTORIO, no secret de archivo, por el mismo motivo que el
      # directorio de identidades: `grants.json` se rota por rename atómico y el
      # rename crea un inodo nuevo. Un secret/bind de archivo deja al gateway
      # leyendo el inodo viejo para siempre, así que una revocación no llegaría
      # jamás. Montado el directorio, el gateway relee la ruta en cada request y
      # ve la fila nueva sin reiniciar nada.
      - type: bind
        source: ${CAUCE_TERMINAL_CONFIG_DIR:-/dev/null}
        target: /run/cauce-terminal
        read_only: true
      # Temporary Telegram bytes only. Provision 0700, uid/gid 1000; never place secrets here.
      - type: bind
        source: ${CAUCE_MEDIA_RUNTIME_DIR:?set a private 0700 temporary media directory}
        target: /run/cauce-media
        bind:
          create_host_path: false
    ports:
      - "${CAUCE_PRIVATE_BIND_IP:-127.0.0.1}:${GATEWAY_TLS_PORT:-8443}:8443"
    healthcheck:
      test: ["CMD", "node", "deploy/readiness-probe.mjs", "http://127.0.0.1:8081/health/ready", "ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      migrator:
        condition: service_completed_successfully
    networks: [edge, backend]

  terminal-relay:
    <<: *runtime-service
    # Opt-in, like every other optional subsystem in this file (origin-relay, telegram, shadow,
    # observability). Without the profile the relay would start on EVERY production stack, and
    # on a stack where the PTY channel is not provisioned its five secrets all default to
    # /dev/null: it would read an empty certificate, fail to bind its TLS listener and, with
    # `restart: always`, crash-loop forever next to a gateway that is not even offering the
    # capability. The profile also keeps the two halves honest — the relay only runs where
    # CAUCE_TERMINAL_ENABLED=1 has been paired with real key material.
    profiles: [terminal]
    # This release intentionally has one authenticated relay route. Scaling without unique mTLS
    # certificates plus a generated closed nginx map would make browser routing ambiguous.
    deploy:
      replicas: 1
    labels:
      io.cauce.terminal-relay.routing: single-authenticated-instance-v1
    command: ["node", "services/terminal-relay/dist/main.js"]
    environment:
      NODE_ENV: production
      CAUCE_TERMINAL_RELAY_BROWSER_PORT: "8446"
      CAUCE_TERMINAL_RELAY_AGENT_PORT: "8445"
      CAUCE_TERMINAL_RELAY_HEALTH_PORT: "8085"
      CAUCE_TERMINAL_RELAY_TLS_CERT_FILE: /run/secrets/terminal_relay_tls_cert
      CAUCE_TERMINAL_RELAY_TLS_KEY_FILE: /run/secrets/terminal_relay_tls_key
      CAUCE_TERMINAL_RELAY_CLIENT_CA_FILE: /run/secrets/gateway_client_ca
      # The console nginx and the gateway governance client are independent
      # principals.  Always retain gateway-client even when the operator
      # customises the console certificate CN list.
      CAUCE_TERMINAL_RELAY_CONSOLE_CN: ${CAUCE_TERMINAL_CONSOLE_CN:-console-client},gateway-client
      CAUCE_TERMINAL_RELAY_AGENT_CA_FILE: /run/secrets/gateway_client_ca
      CAUCE_TERMINAL_RELAY_AGENT_REGISTRY_FILE: /run/cauce-terminal/pty_agent_identities.json
      CAUCE_TERMINAL_GATEWAY_URL: https://gateway:8443
      CAUCE_TERMINAL_RELAY_TOKEN_FILE: /run/secrets/terminal_relay_token
      CAUCE_TERMINAL_GATEWAY_CLIENT_CERT_FILE: /run/secrets/terminal_gateway_client_cert
      CAUCE_TERMINAL_GATEWAY_CLIENT_KEY_FILE: /run/secrets/terminal_gateway_client_key
      CAUCE_TERMINAL_RELAY_INSTANCE_ID: ${CAUCE_TERMINAL_RELAY_INSTANCE_ID:?64 hex - sha256 del DER del leaf mTLS del relay}
      CAUCE_TERMINAL_IDLE_TIMEOUT_SECONDS: "600"
      CAUCE_TERMINAL_OUTPUT_RATE_BYTES_PER_SEC: "262144"
      CAUCE_TERMINAL_SCROLLBACK_BYTES: "20480"
      CAUCE_TERMINAL_MAX_SESSIONS: "16"
      CAUCE_TERMINAL_AUTHZ_INTERVAL_SECONDS: "30"
      CAUCE_TERMINAL_AUTHZ_GRACE_SECONDS: "90"
      CAUCE_TERMINAL_CLAIM_LEASE_SECONDS: "150"
      CAUCE_TERMINAL_PRESENCE_MAX_STALE_SECONDS: "30"
      # Close reports are persisted before delivery to the gateway. A named volume keeps the
      # idempotent report across image replacement and host-side container recreation.
      CAUCE_TERMINAL_CLOSE_SPOOL_FILE: /var/lib/cauce-terminal/close-reports.json
      NODE_EXTRA_CA_CERTS: /run/secrets/gateway_tls_ca
    secrets:
      - source: terminal_relay_tls_cert
        target: terminal_relay_tls_cert
        uid: "1000"
        gid: "1000"
        mode: 0444
      - source: terminal_relay_tls_key
        target: terminal_relay_tls_key
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: terminal_relay_token
        target: terminal_relay_token
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: terminal_gateway_client_cert
        target: terminal_gateway_client_cert
        uid: "1000"
        gid: "1000"
        mode: 0444
      - source: terminal_gateway_client_key
        target: terminal_gateway_client_key
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: gateway_client_ca
        target: gateway_client_ca
        uid: "1000"
        gid: "1000"
        mode: 0444
      - source: gateway_tls_ca
        target: gateway_tls_ca
        uid: "1000"
        gid: "1000"
        mode: 0444
    volumes:
      # Mismo directorio que el gateway: acá vive `pty_agent_identities.json` y
      # también se rota por rename atómico. Ver el comentario del bind en gateway.
      - type: bind
        source: ${CAUCE_TERMINAL_CONFIG_DIR:-/dev/null}
        target: /run/cauce-terminal
        read_only: true
      - terminal_close_spool:/var/lib/cauce-terminal
    ports:
      # Solo la pierna de agentes se publica al host: los agentes PTY viven en
      # kratos y entran por el tailnet. La pierna del navegador (8446) queda
      # interna y solo la alcanza el nginx de la consola por la red `edge`.
      - "${CAUCE_PRIVATE_BIND_IP:-127.0.0.1}:${TERMINAL_RELAY_AGENT_PORT:-8445}:8445"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "deploy/local-readiness-probe.mjs", "http://127.0.0.1:8085/health/ready", "ready"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    networks: [edge]

  dispatcher:
    <<: *runtime-service
    command: ["node", "services/dispatcher/dist/main.js"]
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      NODE_ENV: production
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /run/secrets/postgres_ca
      PORT: "8082"
      DISPATCHER_POLL_MS: ${DISPATCHER_POLL_MS:-100}
      CAUCE_DISPATCHER_STALE_MS: ${CAUCE_DISPATCHER_STALE_MS:-5000}
      CAUCE_ACK_DEADLINE_MS: ${CAUCE_ACK_DEADLINE_MS:-600000}
      # Mismo valor que en el gateway; config.ts exige >= CAUCE_ACK_DEADLINE_MS.
      CAUCE_DELIVERY_LEASE_CAP_MS: ${CAUCE_DELIVERY_LEASE_CAP_MS:-21600000}
      ACK_TIMEOUT_MS: ${ACK_TIMEOUT_MS:-600000}
      INTERACTIVE_BURST: ${INTERACTIVE_BURST:-3}
    secrets: *runtime-secrets
    healthcheck:
      test: ["CMD", "node", "deploy/readiness-probe.mjs", "http://127.0.0.1:8082/health/ready", "ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      migrator:
        condition: service_completed_successfully
    networks: [backend]

  outbox-metrics:
    <<: *runtime-service
    command: ["node", "deploy/outbox-metrics.mjs"]
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      NODE_ENV: production
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /run/secrets/postgres_ca
      # Mutable release-state marker; its path is derived from the content-addressed writer
      # snapshot selector. The deploy driver recreates this service after every marker replace,
      # because a Compose file secret is an inode-pinning bind mount.
      CAUCE_RELEASE_STATE_FILE: /run/secrets/release_state
      PORT: "8084"
    secrets:
      - source: database_url
        target: database_url
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: postgres_ca
        target: postgres_ca
        uid: "1000"
        gid: "1000"
        mode: 0444
      - source: release_state
        target: release_state
        uid: "1000"
        gid: "1000"
        mode: 0444
    healthcheck:
      test: ["CMD", "node", "deploy/readiness-probe.mjs", "http://127.0.0.1:8084/health/ready", "ready"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    depends_on:
      migrator:
        condition: service_completed_successfully
    networks: [backend]

  telegram-bridge:
    <<: *runtime-service
    profiles: [telegram]
    command: ["node", "services/telegram-bridge/dist/main.js"]
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      NODE_ENV: production
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /run/secrets/postgres_ca
      PORT: "8086"
      CAUCE_TELEGRAM_CONFIG_FILE: /run/cauce-telegram/config.json
      CAUCE_TELEGRAM_ALIASES: ${CAUCE_TELEGRAM_ALIASES:-}
      CAUCE_TELEGRAM_MEDIA_DIR: /run/cauce-media
      CAUCE_TELEGRAM_MEDIA_MAX_BYTES: ${CAUCE_MEDIA_MAX_BYTES:-20971520}
      CAUCE_TELEGRAM_MEDIA_TTL_SECONDS: ${CAUCE_MEDIA_TTL_SECONDS:-600}
      CAUCE_TELEGRAM_MEDIA_SWEEP_SECONDS: ${CAUCE_MEDIA_SWEEP_SECONDS:-60}
      # Transcripcion de notas de voz (servicio GPU local via tailnet). Sin declararlas
      # aqui, las variables de prod.env no llegan al contenedor y la transcripcion se apaga.
      CAUCE_TELEGRAM_TRANSCRIPTION_URL: ${CAUCE_TELEGRAM_TRANSCRIPTION_URL:-}
      CAUCE_TELEGRAM_TRANSCRIPTION_MODEL: ${CAUCE_TELEGRAM_TRANSCRIPTION_MODEL:-}
      CAUCE_TELEGRAM_TRANSCRIPTION_LANGUAGE: ${CAUCE_TELEGRAM_TRANSCRIPTION_LANGUAGE:-}
      CAUCE_TELEGRAM_TRANSCRIPTION_TIMEOUT_SECONDS: ${CAUCE_TELEGRAM_TRANSCRIPTION_TIMEOUT_SECONDS:-}
      CAUCE_TELEGRAM_EGRESS_LEASE_MS: ${CAUCE_TELEGRAM_EGRESS_LEASE_MS:-90000}
      CAUCE_TELEGRAM_UPDATE_STALE_MS: ${CAUCE_TELEGRAM_UPDATE_STALE_MS:-180000}
      CAUCE_TELEGRAM_EGRESS_STALE_MS: ${CAUCE_TELEGRAM_EGRESS_STALE_MS:-180000}
    secrets: *runtime-secrets
    volumes:
      - type: bind
        source: ${CAUCE_TELEGRAM_RUNTIME_DIR:-/dev/null}
        target: /run/cauce-telegram
        read_only: true
      - type: bind
        source: ${CAUCE_MEDIA_RUNTIME_DIR:?set a private 0700 temporary media directory}
        target: /run/cauce-media
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "node", "deploy/readiness-probe.mjs", "http://127.0.0.1:8086/health/ready", "ready"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    depends_on:
      migrator:
        condition: service_completed_successfully
    networks: [backend]

  console:
    image: ${CAUCE_CONSOLE_IMAGE:?set an immutable CAUCE_CONSOLE_IMAGE digest}
    user: "101:101"
    restart: always
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /var/cache/nginx:rw,noexec,nosuid,size=32m
      - /var/run:rw,noexec,nosuid,size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${CAUCE_PRIVATE_BIND_IP:-127.0.0.1}:${CONSOLE_TLS_PORT:-8444}:8444"
    secrets:
      - source: console_tls_cert
        target: console_tls_cert
        uid: "101"
        gid: "101"
        mode: 0444
      - source: console_tls_key
        target: console_tls_key
        uid: "101"
        gid: "101"
        mode: 0400
      - source: console_tls_ca
        target: console_tls_ca
        uid: "101"
        gid: "101"
        mode: 0444
      - source: gateway_tls_ca
        target: gateway_tls_ca
        uid: "101"
        gid: "101"
        mode: 0444
      - source: console_gateway_client_cert
        target: console_gateway_client_cert
        uid: "101"
        gid: "101"
        mode: 0444
      - source: console_gateway_client_key
        target: console_gateway_client_key
        uid: "101"
        gid: "101"
        mode: 0400
    healthcheck:
      test: ["CMD-SHELL", "SSL_CERT_FILE=/run/secrets/console_tls_ca wget -q -O /dev/null https://console:8444/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      gateway:
        condition: service_healthy
    networks: [edge]

  otel-collector:
    profiles: [observability]
    image: ${CAUCE_OTEL_IMAGE:?set an immutable CAUCE_OTEL_IMAGE digest}
    user: "10001:10001"
    restart: always
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ../ops/observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol-contrib/config.yaml"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks: [backend]

  prometheus:
    profiles: [observability]
    image: ${CAUCE_PROMETHEUS_IMAGE:?set an immutable CAUCE_PROMETHEUS_IMAGE digest}
    user: "65534:65534"
    restart: always
    command: ["--config.file=/etc/prometheus/prometheus.yaml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ../ops/observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ../ops/observability/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus_data:/prometheus
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 8
    depends_on:
      dispatcher:
        condition: service_healthy
      outbox-metrics:
        condition: service_healthy
    networks: [backend]

secrets:
  database_url:
    file: ${CAUCE_DATABASE_URL_SECRET_PATH:?set CAUCE_DATABASE_URL_SECRET_PATH}
  postgres_ca:
    file: ${CAUCE_POSTGRES_CA_PATH:?set CAUCE_POSTGRES_CA_PATH}
  release_state:
    file: ${CAUCE_ROLLBACK_WRITER_SNAPSHOT_FILE:?set the selected writer snapshot}.state.json
  gateway_tls_cert:
    file: ${CAUCE_GATEWAY_TLS_CERT_PATH:?set CAUCE_GATEWAY_TLS_CERT_PATH}
  gateway_tls_key:
    file: ${CAUCE_GATEWAY_TLS_KEY_PATH:?set CAUCE_GATEWAY_TLS_KEY_PATH}
  gateway_tls_ca:
    file: ${CAUCE_GATEWAY_TLS_CA_PATH:?set CAUCE_GATEWAY_TLS_CA_PATH}
  gateway_client_ca:
    file: ${CAUCE_GATEWAY_CLIENT_CA_PATH:-/dev/null}
  # gateway_token_hashes / gateway_mtls_identities intentionally have no secret definition: they are
  # rotated by atomic rename and must be reached through the CAUCE_GATEWAY_IDENTITY_DIR bind on the
  # gateway service, never as single-file secret mounts.
  gateway_oidc_session_key:
    file: ${CAUCE_GATEWAY_OIDC_SESSION_KEY_PATH:-/dev/null}
  # Clave HMAC del JWT de sesión de la consola. Opt-in como las de arriba: sin la variable
  # apunta a /dev/null y el stack levanta igual, porque nadie la lee salvo con
  # CAUCE_AUTH_PROVIDER=password. En producción vive en /etc/cauce-v3/secrets/console_jwt_key.
  console_jwt_key:
    file: ${CAUCE_CONSOLE_JWT_KEY_PATH:-/dev/null}
  gateway_oidc_client_secret:
    file: ${CAUCE_GATEWAY_OIDC_CLIENT_SECRET_PATH:-/dev/null}
  console_tls_cert:
    file: ${CAUCE_CONSOLE_TLS_CERT_PATH:?set CAUCE_CONSOLE_TLS_CERT_PATH}
  console_tls_key:
    file: ${CAUCE_CONSOLE_TLS_KEY_PATH:?set CAUCE_CONSOLE_TLS_KEY_PATH}
  console_tls_ca:
    file: ${CAUCE_CONSOLE_TLS_CA_PATH:?set CAUCE_CONSOLE_TLS_CA_PATH}
  console_gateway_client_cert:
    file: ${CAUCE_CONSOLE_GATEWAY_CLIENT_CERT_PATH:?set CAUCE_CONSOLE_GATEWAY_CLIENT_CERT_PATH}
  console_gateway_client_key:
    file: ${CAUCE_CONSOLE_GATEWAY_CLIENT_KEY_PATH:?set CAUCE_CONSOLE_GATEWAY_CLIENT_KEY_PATH}
  # El canal PTY es opt-in: sin aprovisionar apuntan a /dev/null y el stack
  # sigue levantando; el gateway queda con CAUCE_TERMINAL_ENABLED=0 y el relay
  # falla cerrado sin certificado.
  terminal_gateway_client_cert:
    file: ${CAUCE_TERMINAL_GATEWAY_CLIENT_CERT_PATH:-/dev/null}
  terminal_gateway_client_key:
    file: ${CAUCE_TERMINAL_GATEWAY_CLIENT_KEY_PATH:-/dev/null}
  terminal_relay_tls_cert:
    file: ${CAUCE_TERMINAL_RELAY_TLS_CERT_PATH:-/dev/null}
  terminal_relay_tls_key:
    file: ${CAUCE_TERMINAL_RELAY_TLS_KEY_PATH:-/dev/null}
  terminal_relay_token:
    file: ${CAUCE_TERMINAL_RELAY_TOKEN_PATH:-/dev/null}
  terminal_ticket_key:
    file: ${CAUCE_TERMINAL_TICKET_KEY_PATH:-/dev/null}
  gateway_relay_client_cert:
    file: ${CAUCE_GATEWAY_RELAY_CLIENT_CERT_PATH:-/etc/cauce-v3/pki/gateway-client.crt}
  gateway_relay_client_key:
    file: ${CAUCE_GATEWAY_RELAY_CLIENT_KEY_PATH:-/etc/cauce-v3/pki/gateway-client.key}

volumes:
  prometheus_data:
  terminal_close_spool:

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
