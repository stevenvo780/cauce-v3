limit_conn_zone $binary_remote_addr zone=cauce_terminal_ws_connections:10m;
limit_req_zone $binary_remote_addr zone=cauce_terminal_ws_attach_rate:10m rate=10r/s;

server {
  listen 8444 ssl;
  server_name console;
  root /usr/share/nginx/html;

  ssl_certificate /run/secrets/console_tls_cert;
  ssl_certificate_key /run/secrets/console_tls_key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_tickets off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' wss:; worker-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

  # Exact match generated from the manifest: wins over the `/v3/` prefix, so only the PTY bytes
  # go to the relay and everything else under /v3/console/terminal/* (capability,
  # targets, sessions) still goes to the gateway. The upstream is resolved via
  # variable against Docker's embedded DNS so a `docker stop` of the relay
  # (kill switch 2) becomes a 502 on this route, not a non-starting nginx.
  # One closed upstream in this release. The console image substitutes this build-time manifest
  # pin before nginx starts; an empty pin becomes an impossible `//ws` route. Client-controlled
  # hostnames and regex-selected relay identities are never upstreams.
  location = "/v3/console/terminal/relays/${CAUCE_TERMINAL_RELAY_INSTANCE_ID}/ws" {
    # A ticket is necessary but unauthenticated upgrade floods must be stopped before they consume
    # relay sockets. Origin is exact same-origin; browsers cannot forge it from another site.
    if ($http_origin != "https://$http_host") { return 403; }
    limit_conn cauce_terminal_ws_connections 32;
    limit_req zone=cauce_terminal_ws_attach_rate burst=20 nodelay;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $cauce_terminal_relay terminal-relay;
    proxy_pass https://$cauce_terminal_relay:8446;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header Origin $http_origin;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    proxy_ssl_server_name on;
    proxy_ssl_name terminal-relay;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /run/secrets/gateway_tls_ca;
    proxy_ssl_certificate /run/secrets/console_gateway_client_cert;
    proxy_ssl_certificate_key /run/secrets/console_gateway_client_key;
  }

  location /v3/ws {
    proxy_pass https://gateway:8443;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_ssl_server_name on;
    proxy_ssl_name gateway;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /run/secrets/gateway_tls_ca;
    proxy_ssl_certificate /run/secrets/console_gateway_client_cert;
    proxy_ssl_certificate_key /run/secrets/console_gateway_client_key;
  }

  location /v3/ {
    proxy_pass https://gateway:8443;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Operator identity comes from the user session (JWT -> console_users), not from a
    # fixed header. The client-supplied header is stripped so no one can impersonate another.
    # Works together with CAUCE_AUTH_PROVIDER=password: without login enabled, stripping it
    # leaves PTY sessions unattributed and blocks other tenants' destinations (attribution_required).
    proxy_set_header X-Cauce-Operator "";
    proxy_ssl_server_name on;
    proxy_ssl_name gateway;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /run/secrets/gateway_tls_ca;
    proxy_ssl_certificate /run/secrets/console_gateway_client_cert;
    proxy_ssl_certificate_key /run/secrets/console_gateway_client_key;
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    # Repeated on purpose: an add_header here cancels inheritance from the server block,
    # so without these the SPA would be served without CSP or HSTS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' wss:; worker-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    # Repeated on purpose: an add_header here cancels inheritance from the server block,
    # so without these the SPA would be served without CSP or HSTS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' wss:; worker-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
  }
}
