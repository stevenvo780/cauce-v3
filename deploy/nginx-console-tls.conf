server {
  listen 8444 ssl;
  server_name console;
  root /usr/share/nginx/html;

  ssl_certificate /run/secrets/console_tls_cert;
  ssl_certificate_key /run/secrets/console_tls_key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_tickets off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' wss:; worker-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

  location /v3/ws {
    proxy_pass https://gateway:8443;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_ssl_server_name on;
    proxy_ssl_name gateway;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /run/secrets/gateway_tls_ca;
    proxy_ssl_certificate /run/secrets/console_gateway_client_cert;
    proxy_ssl_certificate_key /run/secrets/console_gateway_client_key;
  }

  location /v3/ {
    proxy_pass https://gateway:8443;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_ssl_server_name on;
    proxy_ssl_name gateway;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /run/secrets/gateway_tls_ca;
    proxy_ssl_certificate /run/secrets/console_gateway_client_cert;
    proxy_ssl_certificate_key /run/secrets/console_gateway_client_key;
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
