server {
  listen 8444 ssl;
  server_name console;
  root /usr/share/nginx/html;

  ssl_certificate /run/secrets/console_tls_cert;
  ssl_certificate_key /run/secrets/console_tls_key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_tickets off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' wss:; worker-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

  # Match exacto: gana sobre el prefijo `/v3/`, así que solo los bytes del PTY
  # salen al relay y todo el resto de /v3/console/terminal/* (capability,
  # targets, sessions) sigue yendo al gateway. El upstream se resuelve por
  # variable contra el DNS embebido de Docker para que `docker stop` del relay
  # (kill switch 2) sea un 502 en esta ruta y no un nginx que no arranca.
  location = /v3/console/terminal/ws {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $cauce_terminal_relay terminal-relay;
    proxy_pass https://$cauce_terminal_relay:8446;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    proxy_ssl_server_name on;
    proxy_ssl_name terminal-relay;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /run/secrets/gateway_tls_ca;
    proxy_ssl_certificate /run/secrets/console_gateway_client_cert;
    proxy_ssl_certificate_key /run/secrets/console_gateway_client_key;
  }

  location /v3/ws {
    proxy_pass https://gateway:8443;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_ssl_server_name on;
    proxy_ssl_name gateway;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /run/secrets/gateway_tls_ca;
    proxy_ssl_certificate /run/secrets/console_gateway_client_cert;
    proxy_ssl_certificate_key /run/secrets/console_gateway_client_key;
  }

  location /v3/ {
    proxy_pass https://gateway:8443;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Identidad humana del operador para el plano PTY. El certificado de cliente sólo dice
    # `Steven:kant` (la consola); el gateway exige además nombrar a la persona, y sin esta
    # cabecera todo destino contesta `authorized:false` aunque los grants existan.
    # Se fija acá y no en el navegador a propósito: así el cliente no puede atribuirse a otro.
    # Si algún día hay más de un humano en la consola, esto pasa a salir de su sesión.
    proxy_set_header X-Cauce-Operator "steven";
    proxy_ssl_server_name on;
    proxy_ssl_name gateway;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /run/secrets/gateway_tls_ca;
    proxy_ssl_certificate /run/secrets/console_gateway_client_cert;
    proxy_ssl_certificate_key /run/secrets/console_gateway_client_key;
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    # Repetidas a proposito: un add_header aqui cancela la herencia de los del server,
    # asi que sin esto la SPA se servia sin CSP ni HSTS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' wss:; worker-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    # Repetidas a proposito: un add_header aqui cancela la herencia de los del server,
    # asi que sin esto la SPA se servia sin CSP ni HSTS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' wss:; worker-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
  }
}
