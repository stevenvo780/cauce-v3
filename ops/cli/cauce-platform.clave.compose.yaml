# Added by ops/cli/cauce-platform-contenedor only for `empresa importar --clave-archivo FILE`: that host file,
# read-only, at the path the wrapper hands to the CLI instead of FILE.
services:
  cauce-platform:
    volumes:
      - type: bind
        source: ${CAUCE_PLATAFORMA_CLAVE:?run through ops/cli/cauce-platform-contenedor}
        target: /run/cauce/clave
        read_only: true
