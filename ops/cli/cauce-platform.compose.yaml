# One-off service for ops/cli/cauce-platform-contenedor: the platform CLI (platform_admin.mjs, or
# context_seed.mjs for `contexto`) inside the release runtime image, on the stack's backend network,
# with the migrator's owner URL and the PostgreSQL CA as file secrets. The three scripts are mounted
# because context_seed.mjs imports platform_admin.mjs and platform_admin.mjs loads company_import.mjs for
# `empresa importar`; the image supplies packages/store/dist. It never publishes ports and never joins
# the stack project.
name: ${CAUCE_PLATAFORMA_PROYECTO:?run through ops/cli/cauce-platform-contenedor}

services:
  cauce-platform:
    image: ${CAUCE_RUNTIME_IMAGE:?set an immutable CAUCE_RUNTIME_IMAGE digest}
    user: "1000:1000"
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    entrypoint: ["/app/deploy/runtime-entrypoint.sh", "node", "ops/cli/${CAUCE_PLATAFORMA_ENTRADA:?run through ops/cli/cauce-platform-contenedor}"]
    command: ["--help"]
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      NODE_ENV: production
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /run/secrets/postgres_ca
      CAUCE_PLATFORM_ADMIN_ID: ${CAUCE_PLATFORM_ADMIN_ID:-}
      CAUCE_IMPORT_OWNER_EMAIL: ${CAUCE_IMPORT_OWNER_EMAIL:-}
    volumes:
      - type: bind
        source: ${CAUCE_PLATAFORMA_CLI:?run through ops/cli/cauce-platform-contenedor}/platform_admin.mjs
        target: /app/ops/cli/platform_admin.mjs
        read_only: true
      - type: bind
        source: ${CAUCE_PLATAFORMA_CLI:?run through ops/cli/cauce-platform-contenedor}/context_seed.mjs
        target: /app/ops/cli/context_seed.mjs
        read_only: true
      - type: bind
        source: ${CAUCE_PLATAFORMA_CLI:?run through ops/cli/cauce-platform-contenedor}/company_import.mjs
        target: /app/ops/cli/company_import.mjs
        read_only: true
    secrets:
      - database_url
      - postgres_ca
    networks: [backend]

secrets:
  database_url:
    file: ${CAUCE_DATABASE_URL_SECRET_PATH:?set CAUCE_DATABASE_URL_SECRET_PATH}
  postgres_ca:
    file: ${CAUCE_POSTGRES_CA_PATH:?set CAUCE_POSTGRES_CA_PATH}

networks:
  backend:
    external: true
    name: ${CAUCE_PLATAFORMA_RED:?run through ops/cli/cauce-platform-contenedor}
