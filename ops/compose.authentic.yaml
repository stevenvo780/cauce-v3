name: ${COMPOSE_PROJECT_NAME:-cauce-v3-compose-authentic}

x-final-runtime: &final-runtime
  image: ${CAUCE_AUTHENTIC_RUNTIME_IMAGE:?set the final runtime image}
  user: "1000:1000"
  init: true
  restart: "no"
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  stop_grace_period: 20s
  entrypoint: ["/app/deploy/runtime-entrypoint.sh"]

x-database-environment: &database-environment
  DATABASE_URL: postgresql://cauce_authentic@postgres:5432/cauce_authentic
  NODE_ENV: test

x-fixture-mount: &fixture-mount
  type: bind
  source: ${CAUCE_AUTHENTIC_FIXTURE_DIR:?set a private ephemeral fixture directory}
  target: /fixtures
  read_only: true

services:
  fixture-init:
    image: ${CAUCE_AUTHENTIC_HELPER_IMAGE:?set the authentic helper image}
    user: "0:0"
    restart: "no"
    command: ["node", "ops/harness/authentic-fixture-init.mjs"]
    environment:
      CAUCE_FIXTURE_DIR: /fixtures
      CAUCE_ROUTER_DIR: /sockets/router
      CAUCE_V2_SOCKET_DIR: /sockets/v2
      CAUCE_V3_SOCKET_DIR: /sockets/v3
      CAUCE_FIXTURES_PREGENERATED: "1"
    volumes:
      - type: bind
        source: ${CAUCE_AUTHENTIC_FIXTURE_DIR:?set a private ephemeral fixture directory}
        target: /fixtures
      - type: bind
        source: ${CAUCE_AUTHENTIC_ROUTER_DIR:?set a private router socket directory}
        target: /sockets/router
      - type: bind
        source: ${CAUCE_AUTHENTIC_V2_DIR:?set a private V2 socket directory}
        target: /sockets/v2
      - type: bind
        source: ${CAUCE_AUTHENTIC_V3_DIR:?set a private V3 socket directory}
        target: /sockets/v3
    networks: [authentic]

  postgres:
    image: ${CAUCE_AUTHENTIC_POSTGRES_IMAGE:-postgres:16-alpine}
    restart: "no"
    environment:
      POSTGRES_DB: cauce_authentic
      POSTGRES_USER: cauce_authentic
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - authentic_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cauce_authentic -d cauce_authentic && test \"$$(psql -U cauce_authentic -d cauce_authentic -Atqc 'SELECT 1')\" = 1"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [authentic]

  migrator:
    <<: *final-runtime
    command: ["node", "deploy/migrate.mjs"]
    environment: *database-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks: [authentic]

  fake-external:
    image: ${CAUCE_AUTHENTIC_HELPER_IMAGE:?set the authentic helper image}
    user: "0:0"
    restart: "no"
    command: ["node", "ops/harness/authentic-external-server.mjs"]
    environment:
      CAUCE_FIXTURE_DIR: /fixtures
      HTTPS_PORT: "443"
      CONTROL_PORT: "9080"
    volumes:
      - <<: *fixture-mount
    configs:
      - source: authentic_control_probe
        target: /app/ops/harness/authentic-control-probe.mjs
    ports:
      - "127.0.0.1:${CAUCE_AUTHENTIC_CONTROL_PORT:?set control port}:9080"
    healthcheck:
      test: ["CMD", "node", "ops/harness/authentic-control-probe.mjs", "http://127.0.0.1:9080/health/ready", "ready"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      fixture-init:
        condition: service_completed_successfully
    networks:
      authentic:
        ipv4_address: ${CAUCE_AUTHENTIC_EXTERNAL_IP:-192.31.253.10}
        aliases: [api.telegram.org, webhook.test]
      control:

  unix-target:
    image: ${CAUCE_AUTHENTIC_HELPER_IMAGE:?set the authentic helper image}
    restart: "no"
    command: ["node", "ops/harness/authentic-unix-target.mjs"]
    environment:
      CAUCE_V2_TARGET_SOCKET: /sockets/v2/ingress.sock
      CAUCE_V3_TARGET_SOCKET: /sockets/v3/ingress.sock
      CAUCE_ROUTER_SOCKET: /sockets/router/router.sock
      CAUCE_SHADOW_EVENTS_FILE: /fixtures/shadow-events.jsonl
      CONTROL_PORT: "9081"
    volumes:
      - type: bind
        source: ${CAUCE_AUTHENTIC_FIXTURE_DIR:?set a private ephemeral fixture directory}
        target: /fixtures
      - type: bind
        source: ${CAUCE_AUTHENTIC_V2_DIR:?set a private V2 socket directory}
        target: /sockets/v2
      - type: bind
        source: ${CAUCE_AUTHENTIC_V3_DIR:?set a private V3 socket directory}
        target: /sockets/v3
      - type: bind
        source: ${CAUCE_AUTHENTIC_ROUTER_DIR:?set a private router socket directory}
        target: /sockets/router
    configs:
      - source: authentic_control_probe
        target: /app/ops/harness/authentic-control-probe.mjs
    ports:
      - "127.0.0.1:${CAUCE_AUTHENTIC_UNIX_CONTROL_PORT:?set Unix control port}:9081"
    healthcheck:
      test: ["CMD", "node", "ops/harness/authentic-control-probe.mjs", "http://127.0.0.1:9081/health/ready", "ready"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      fixture-init:
        condition: service_completed_successfully
    networks: [authentic, control]

  gateway:
    <<: *final-runtime
    command: ["node", "services/gateway/dist/main.js"]
    environment:
      <<: *database-environment
      CAUCE_AUTH_PROVIDER: mtls
      CAUCE_MTLS_IDENTITY_FILE: /fixtures/mtls-identities.json
      CAUCE_TLS_CERT_FILE: /fixtures/gateway.crt
      CAUCE_TLS_KEY_FILE: /fixtures/gateway.key
      CAUCE_TLS_CLIENT_CA_FILE: /fixtures/ca.crt
      CAUCE_HEALTH_PORT: "8081"
      CAUCE_CONSOLE_ORIGINS: https://console.invalid
      CAUCE_REQUIRE_ACK_CLAIMS: "1"
      CAUCE_ACK_DEADLINE_MS: "250"
      PORT: "8443"
    volumes:
      - <<: *fixture-mount
    ports:
      - "127.0.0.1:${CAUCE_AUTHENTIC_GATEWAY_PORT:?set gateway port}:8443"
    healthcheck:
      test: ["CMD", "node", "deploy/readiness-probe.mjs", "http://127.0.0.1:8081/health/ready", "ready"]
      interval: 2s
      timeout: 5s
      retries: 40
    depends_on:
      fixture-init:
        condition: service_completed_successfully
      migrator:
        condition: service_completed_successfully
    networks: [authentic, control]

  dispatcher:
    <<: *final-runtime
    command: ["node", "services/dispatcher/dist/main.js"]
    environment:
      <<: *database-environment
      PORT: "8082"
      DISPATCHER_POLL_MS: "20"
      CAUCE_ACK_DEADLINE_MS: "250"
      ACK_TIMEOUT_MS: "250"
      INTERACTIVE_BURST: "3"
    healthcheck:
      test: ["CMD", "node", "deploy/readiness-probe.mjs", "http://127.0.0.1:8082/health/ready", "ready"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      migrator:
        condition: service_completed_successfully
    networks: [authentic]

  relay-worker:
    <<: *final-runtime
    command: ["node", "services/relay-worker/dist/main.js"]
    environment:
      <<: *database-environment
      NODE_EXTRA_CA_CERTS: /fixtures/ca.crt
      CAUCE_WEBHOOK_PROVIDER_MODULE: file:///fixtures/webhook-provider.mjs
      CAUCE_RELAY_ALLOWED_ORIGINS: https://webhook.test
      CAUCE_RELAY_ADAPTERS: webhook
      CAUCE_RELAY_POLL_MS: "600000"
      NODE_OPTIONS: --no-network-family-autoselection
      PORT: "8083"
    volumes:
      - <<: *fixture-mount
    healthcheck:
      test: ["CMD", "node", "deploy/readiness-probe.mjs", "http://127.0.0.1:8083/health/ready", "ready"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      migrator:
        condition: service_completed_successfully
      fake-external:
        condition: service_healthy
    networks: [authentic]

  telegram-bridge:
    <<: *final-runtime
    command: ["node", "services/telegram-bridge/dist/main.js"]
    environment:
      <<: *database-environment
      NODE_EXTRA_CA_CERTS: /fixtures/ca.crt
      CAUCE_TELEGRAM_CONFIG_FILE: /fixtures/telegram-config.json
      CAUCE_TELEGRAM_ALIASES: jarvis
      PORT: "8086"
    volumes:
      - <<: *fixture-mount
    healthcheck:
      test: ["CMD", "node", "deploy/readiness-probe.mjs", "http://127.0.0.1:8086/health/ready", "ready"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      migrator:
        condition: service_completed_successfully
      fake-external:
        condition: service_healthy
    networks: [authentic]

  shadow-router:
    <<: *final-runtime
    command: ["node", "services/shadow-router/dist/main.js"]
    environment:
      <<: *database-environment
      SHADOW_ROUTER_MODE: shadow
      SHADOW_ROUTER_TENANTS: Steven
      SHADOW_ROUTER_SOCKET: /sockets/router/router.sock
      SHADOW_ROUTER_V2_SOCKET: /sockets/v2/ingress.sock
      SHADOW_ROUTER_V3_SOCKET: /sockets/v3/ingress.sock
      SHADOW_ROUTER_HEALTH_STALE_MS: "30000"
      SHADOW_ROUTER_SHUTDOWN_MS: "5000"
    volumes:
      - type: bind
        source: ${CAUCE_AUTHENTIC_ROUTER_DIR:?set a private router socket directory}
        target: /sockets/router
      - type: bind
        source: ${CAUCE_AUTHENTIC_V2_DIR:?set a private V2 socket directory}
        target: /sockets/v2
        read_only: true
      - type: bind
        source: ${CAUCE_AUTHENTIC_V3_DIR:?set a private V3 socket directory}
        target: /sockets/v3
        read_only: true
    healthcheck:
      test: ["CMD", "node", "deploy/unix-readiness-probe.mjs", "/sockets/router/router.sock", "/health/ready", "ready"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      migrator:
        condition: service_completed_successfully
      unix-target:
        condition: service_healthy
    networks: [authentic]

volumes:
  authentic_pgdata:

configs:
  authentic_control_probe:
    file: ./harness/authentic-control-probe.mjs

networks:
  authentic:
    internal: true
    ipam:
      config:
        - subnet: ${CAUCE_AUTHENTIC_SUBNET:-192.31.253.0/24}
  control:
    internal: false
