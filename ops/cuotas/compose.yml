# Un contenedor por cuenta de Claude. Cada uno con su propio volumen para el token,
# asi las sesiones no se mezclan. Ninguno publica puertos: no hay nada que exponer.
#
# Como se autentica cada uno (una sola vez, por terminal):
#   docker exec -it "$QUOTA_CONTAINER" claude auth login
# Como se lee una cuota:
#   docker exec "$QUOTA_CONTAINER" node /usr/local/bin/leer-cuota.mjs
#
# Consumo: ~5 MB de RAM por contenedor en reposo (solo un `sleep`). La imagen (806 MB)
# es una sola para todos.
services:
  # Primera cuenta: Claude + Gemini + Codex
  cuota-claude-1:
    image: cuota-cli:latest
    container_name: cuota-claude-1
    hostname: cuota-claude-1
    restart: unless-stopped
    volumes: ["cuota-claude-1:/home/node"]
    mem_limit: 512m
    network_mode: bridge
  # Tercera cuenta de Claude (por CLI como las demas).
  cuota-claude-3:
    image: cuota-cli:latest
    container_name: cuota-claude-3
    hostname: cuota-claude-3
    restart: unless-stopped
    volumes: ["cuota-claude-3:/home/node"]
    mem_limit: 512m
    network_mode: bridge
  # Cuenta de Codex
  cuota-codex-b2b:
    image: cuota-cli:latest
    container_name: cuota-codex-b2b
    hostname: cuota-codex-b2b
    restart: unless-stopped
    volumes: ["cuota-codex-b2b:/home/node"]
    mem_limit: 512m
    network_mode: bridge

  # Cuenta Grok / SuperGrok (login device-auth: cuota-auth grok-1 grok)
  cuota-grok-1:
    image: cuota-cli:latest
    container_name: cuota-grok-1
    hostname: cuota-grok-1
    restart: unless-stopped
    volumes: ["cuotas-cli_cuota-grok-1:/home/node"]
    mem_limit: 512m
    network_mode: bridge

volumes:
  cuota-claude-3:
  cuotas-cli_cuota-grok-1:
  cuota-claude-1:
  cuota-codex-b2b:
