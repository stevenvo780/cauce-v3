# Parche 2026-08-02 (zeus, por decisión de Steven): la redacción de secretos en la INGESTA de
# Telegram queda APAGADA.
#
# Por qué: la redacción le impidió pasarle a `socrates` el token de @polidinamica_sell_bot tres
# veces (21:10, 21:26 y 21:59 UTC) y el agente contestó "Cauce me entregó el token como
# [secreto-redactado], así que no puedo leerlo ni instalarlo". Montar un sistema de punta a punta
# implica pasarle credenciales a quien lo monta. Steven asumió el costo (el texto queda escrito en
# `messages.body`): tiene limpieza periódica de historiales.
#
# El montaje sobre `dist/redaction.js` YA NO EXISTE: ese fichero desapareció de la imagen cuando la
# redacción se mudó a `@cauce/protocol`, así que el bind mount habría fallado o habría inyectado un
# módulo huérfano. La decisión se expresa ahora con el interruptor soportado, que el puente lee con
# `redactionEnabledFromEnv(process.env, 'CAUCE_TELEGRAM_REDACT_INGRESS', false)`: el código ya viene
# apagado por defecto y esta variable lo deja explícito en la capa de compose. Encenderla es ponerla
# en "1" acá o en `/etc/cauce-v3/prod.env`, sin tocar código ni montar nada.
services:
  telegram-bridge:
    environment:
      CAUCE_TELEGRAM_REDACT_INGRESS: "0"
