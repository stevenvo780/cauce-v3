apiVersion: cauce.io/v3
kind: AliasRuntime
metadata:
  name: argos
spec:
  tenant: Steven
  room: grp.steven
  alias: argos
  harness: claude
  profile: {seedOnConnect: true, configScope: alias}
  origin: {transport: telegram}
  relay: {urlPathEnv: CAUCE_ARGOS_RELAY_URL, requiredScheme: wss}
  secretPathEnv:
    token: CAUCE_ARGOS_TOKEN_PATH
    clientCertificate: CAUCE_ARGOS_CERT_PATH
    clientKey: CAUCE_ARGOS_KEY_PATH
    certificateAuthority: CAUCE_ARGOS_CA_PATH
  process:
    executablePathEnv: CAUCE_ARGOS_EXEC_PATH
  stateDirectory: /var/lib/cauce-v3/aliases/argos
