apiVersion: cauce.io/v3
kind: AliasRuntime
metadata:
  name: astra
spec:
  tenant: Steven
  room: grp.steven
  alias: astra
  harness: codex
  profile: {seedOnConnect: true, configScope: alias}
  origin: {transport: telegram}
  relay: {urlPathEnv: CAUCE_ASTRA_RELAY_URL, requiredScheme: wss}
  secretPathEnv:
    token: CAUCE_ASTRA_TOKEN_PATH
    clientCertificate: CAUCE_ASTRA_CERT_PATH
    clientKey: CAUCE_ASTRA_KEY_PATH
    certificateAuthority: CAUCE_ASTRA_CA_PATH
  process: {executablePathEnv: CAUCE_ASTRA_EXEC_PATH}
  stateDirectory: /var/lib/cauce-v3/aliases/astra
