apiVersion: cauce.io/v3
kind: AliasRuntime
metadata:
  name: backend
spec:
  tenant: Hospital
  room: grp.hospital
  alias: backend
  harness: openclaw
  profile: {seedOnConnect: true, configScope: alias, workspace: /home/node/clawd}
  origin: {transport: telegram}
  relay: {urlPathEnv: CAUCE_BACKEND_RELAY_URL, requiredScheme: wss}
  secretPathEnv:
    token: CAUCE_BACKEND_TOKEN_PATH
    clientCertificate: CAUCE_BACKEND_CERT_PATH
    clientKey: CAUCE_BACKEND_KEY_PATH
    certificateAuthority: CAUCE_BACKEND_CA_PATH
  process: {executablePathEnv: CAUCE_BACKEND_EXEC_PATH}
  stateDirectory: /var/lib/cauce-v3/aliases/backend
