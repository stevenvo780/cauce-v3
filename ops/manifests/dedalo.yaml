apiVersion: cauce.io/v3
kind: AliasRuntime
metadata:
  name: dedalo
spec:
  tenant: Pablo
  room: grp.pablo
  alias: dedalo
  harness: codex
  profile: {seedOnConnect: true, configScope: alias}
  origin: {transport: telegram}
  relay: {urlPathEnv: CAUCE_DEDALO_RELAY_URL, requiredScheme: wss}
  secretPathEnv:
    token: CAUCE_DEDALO_TOKEN_PATH
    clientCertificate: CAUCE_DEDALO_CERT_PATH
    clientKey: CAUCE_DEDALO_KEY_PATH
    certificateAuthority: CAUCE_DEDALO_CA_PATH
  process: {executablePathEnv: CAUCE_DEDALO_EXEC_PATH}
  stateDirectory: /var/lib/cauce-v3/aliases/dedalo
