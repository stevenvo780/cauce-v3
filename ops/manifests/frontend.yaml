apiVersion: cauce.io/v3
kind: AliasRuntime
metadata:
  name: frontend
spec:
  tenant: Hospital
  room: grp.hospital
  alias: frontend
  harness: openclaw
  profile: {seedOnConnect: true, configScope: alias, workspace: /home/node/clawd}
  origin: {transport: telegram}
  relay: {urlPathEnv: CAUCE_FRONTEND_RELAY_URL, requiredScheme: wss}
  secretPathEnv:
    token: CAUCE_FRONTEND_TOKEN_PATH
    clientCertificate: CAUCE_FRONTEND_CERT_PATH
    clientKey: CAUCE_FRONTEND_KEY_PATH
    certificateAuthority: CAUCE_FRONTEND_CA_PATH
  process: {executablePathEnv: CAUCE_FRONTEND_EXEC_PATH}
  stateDirectory: /var/lib/cauce-v3/aliases/frontend
