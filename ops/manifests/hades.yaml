apiVersion: cauce.io/v3
kind: AliasRuntime
metadata:
  name: hades
spec:
  tenant: Steven
  room: grp.steven
  alias: hades
  harness: grok
  profile: {seedOnConnect: true, configScope: alias}
  origin: {transport: telegram}
  relay: {urlPathEnv: CAUCE_HADES_RELAY_URL, requiredScheme: wss}
  secretPathEnv:
    token: CAUCE_HADES_TOKEN_PATH
    clientCertificate: CAUCE_HADES_CERT_PATH
    clientKey: CAUCE_HADES_KEY_PATH
    certificateAuthority: CAUCE_HADES_CA_PATH
  process: {executablePathEnv: CAUCE_HADES_EXEC_PATH}
  stateDirectory: /var/lib/cauce-v3/aliases/hades
