apiVersion: cauce.io/v3
kind: AliasRuntime
metadata:
  name: jarvis
spec:
  tenant: Steven
  room: grp.steven
  alias: jarvis
  harness: openclaw
  profile: {seedOnConnect: true, configScope: alias, workspace: /home/claw/clawd}
  origin: {transport: telegram}
  relay: {urlPathEnv: CAUCE_JARVIS_RELAY_URL, requiredScheme: wss}
  secretPathEnv:
    token: CAUCE_JARVIS_TOKEN_PATH
    clientCertificate: CAUCE_JARVIS_CERT_PATH
    clientKey: CAUCE_JARVIS_KEY_PATH
    certificateAuthority: CAUCE_JARVIS_CA_PATH
  process: {executablePathEnv: CAUCE_JARVIS_EXEC_PATH}
  stateDirectory: /var/lib/cauce-v3/aliases/jarvis
