apiVersion: cauce.io/v3
kind: AliasRuntime
metadata:
  name: salva
spec:
  tenant: Isa
  room: grp.isa
  alias: salva
  harness: claude
  origin: {transport: telegram}
  relay: {urlPathEnv: CAUCE_SALVA_RELAY_URL, requiredScheme: wss}
  secretPathEnv:
    token: CAUCE_SALVA_TOKEN_PATH
    clientCertificate: CAUCE_SALVA_CERT_PATH
    clientKey: CAUCE_SALVA_KEY_PATH
    certificateAuthority: CAUCE_SALVA_CA_PATH
  process: {executablePathEnv: CAUCE_SALVA_EXEC_PATH}
  stateDirectory: /var/lib/cauce-v3/aliases/salva
