apiVersion: cauce.io/v3
kind: AliasRuntime
metadata:
  name: tales
spec:
  tenant: Jhon
  room: grp.jhon
  alias: tales
  harness: codex
  profile: {seedOnConnect: true, configScope: alias}
  origin: {transport: telegram}
  relay: {urlPathEnv: CAUCE_TALES_RELAY_URL, requiredScheme: wss}
  secretPathEnv:
    token: CAUCE_TALES_TOKEN_PATH
    clientCertificate: CAUCE_TALES_CERT_PATH
    clientKey: CAUCE_TALES_KEY_PATH
    certificateAuthority: CAUCE_TALES_CA_PATH
  process: {executablePathEnv: CAUCE_TALES_EXEC_PATH}
  stateDirectory: /var/lib/cauce-v3/aliases/tales
