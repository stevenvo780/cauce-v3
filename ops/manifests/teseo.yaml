apiVersion: cauce.io/v3
kind: AliasRuntime
metadata:
  name: teseo
spec:
  tenant: Hospital
  room: grp.hospital
  alias: teseo
  harness: openclaw
  profile: {seedOnConnect: true, configScope: alias, workspace: /home/node/clawd}
  origin: {transport: telegram}
  relay: {urlPathEnv: CAUCE_TESEO_RELAY_URL, requiredScheme: wss}
  secretPathEnv:
    token: CAUCE_TESEO_TOKEN_PATH
    clientCertificate: CAUCE_TESEO_CERT_PATH
    clientKey: CAUCE_TESEO_KEY_PATH
    certificateAuthority: CAUCE_TESEO_CA_PATH
  process: {executablePathEnv: CAUCE_TESEO_EXEC_PATH}
  stateDirectory: /var/lib/cauce-v3/aliases/teseo
