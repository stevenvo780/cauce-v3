apiVersion: cauce.io/v3
kind: AliasRuntime
metadata:
  name: vulcano
spec:
  tenant: Pablo
  room: grp.pablo
  alias: vulcano
  harness: claude
  profile: {seedOnConnect: true, configScope: alias}
  origin: {transport: telegram}
  relay: {urlPathEnv: CAUCE_VULCANO_RELAY_URL, requiredScheme: wss}
  secretPathEnv:
    token: CAUCE_VULCANO_TOKEN_PATH
    clientCertificate: CAUCE_VULCANO_CERT_PATH
    clientKey: CAUCE_VULCANO_KEY_PATH
    certificateAuthority: CAUCE_VULCANO_CA_PATH
  process: {executablePathEnv: CAUCE_VULCANO_EXEC_PATH}
  stateDirectory: /var/lib/cauce-v3/aliases/vulcano
