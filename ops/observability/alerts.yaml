groups:
  - name: cauce-v3-alert-delivery
    rules:
      - alert: CauceAlertmanagerDown
        expr: absent(up{job="cauce-alertmanager"}) or up{job="cauce-alertmanager"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Alertmanager is unavailable; Cauce alerts cannot reach the operator"
      - alert: CauceAlertDeliveryErrors
        expr: sum(increase(prometheus_notifications_errors_total[10m])) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus is failing to deliver alerts"
      - alert: CauceAlertDeliveryDropped
        expr: sum(increase(prometheus_notifications_dropped_total[10m])) > 0
        labels:
          severity: critical
        annotations:
          summary: "Prometheus dropped queued alert notifications"
      - alert: CauceAlertDeliveryQueueSaturated
        expr: prometheus_notifications_queue_length / prometheus_notifications_queue_capacity > 0.8
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus alert notification queue is near capacity"

  - name: cauce-v3-dispatcher-availability
    rules:
      - alert: CauceDispatcherDown
        expr: absent(up{job="cauce-dispatcher"}) or up{job="cauce-dispatcher"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Dispatcher metrics endpoint is unavailable"
      - alert: CauceDispatcherLoopStale
        expr: absent(cauce_dispatcher_loop_stale) or cauce_dispatcher_loop_stale == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Dispatcher process exists but its work loop is not progressing"
      - alert: CauceDispatcherUnready
        expr: absent(cauce_dispatcher_ready) or cauce_dispatcher_ready == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Dispatcher has no recent clean work-loop tick"
      - alert: CauceDispatcherFencedCompletion
        expr: increase(cauce_dispatcher_ticks_total{result="fenced"}[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Dispatcher completion was fenced and was not counted as a successful tick"
      - alert: CauceDispatcherDatabaseMetricsMissing
        expr: cauce_dispatcher_metrics_query_success == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Dispatcher cannot collect exact PostgreSQL gauges"

  - name: cauce-v3-gateway-availability
    rules:
      - alert: CauceGatewayMetricsDown
        expr: absent(up{job="cauce-gateway"}) or up{job="cauce-gateway"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Gateway health and wake-pump metrics are unavailable"
      - alert: CauceGatewayWakePumpStale
        expr: absent(cauce_gateway_wake_pump_last_success_timestamp_seconds) or time() - cauce_gateway_wake_pump_last_success_timestamp_seconds > 60
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Gateway is live but its durable wake pump has no clean completed cycle"
      - alert: CauceGatewayWakePumpFenced
        expr: increase(cauce_gateway_wake_pump_outcomes_total{result="fenced"}[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Gateway emitted a wake whose durable ACK was fenced"
      - alert: CauceGatewayWakePumpErrors
        expr: increase(cauce_gateway_wake_pump_outcomes_total{result="error"}[10m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Gateway wake-pump operations are failing"
      - alert: CauceConsolePublishIntentRateLimited
        expr: increase(cauce_gateway_console_publish_operations_total{operation="prepare",result="rate_limited"}[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Console publish journal reached its per-operator durable reservation bound"
      - alert: CauceConsolePublishIntentExpiryBurst
        expr: increase(cauce_gateway_console_publish_operations_total{operation="publish",result="expired"}[15m]) >= 5
        labels:
          severity: warning
        annotations:
          summary: "Console publish owners are repeatedly arriving after their durable reservations expired"

  - name: cauce-v3-queues
    rules:
      - alert: CauceDeliveryDlqGrowing
        expr: sum(delta(cauce_dispatcher_dlq_depth{target="delivery"}[10m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Delivery dead letters increased"
      - alert: CauceJobDlqGrowing
        expr: sum(delta(cauce_dispatcher_dlq_depth{target="job"}[10m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Job dead letters increased"
      - alert: CauceDeliveryRetryBacklog
        expr: sum by (lane) (cauce_dispatcher_delivery_queue_depth{status="retry"}) > 25
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Delivery retry backlog is elevated in lane {{ $labels.lane }}"
      - alert: CauceInteractiveDeliveryStalled
        expr: max(cauce_dispatcher_delivery_oldest_seconds{lane="interactive",status=~"pending|retry"}) > 60
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Interactive delivery queue is not progressing"
      - alert: CauceBatchDeliveryStalled
        expr: max(cauce_dispatcher_delivery_oldest_seconds{lane="batch",status=~"pending|retry"}) > 300
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Batch delivery queue is not progressing"
      - alert: CauceJobLaneStalled
        expr: max by (lane) (cauce_dispatcher_job_oldest_seconds{status="queued"}) > 300
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Job lane {{ $labels.lane }} is stalled"
      - alert: CauceUnknownJobKinds
        expr: increase(cauce_dispatcher_jobs_processed_total{result="unknown_kind"}[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Unregistered job kinds were rejected into DLQ"

  - name: cauce-v3-leases-and-relay
    rules:
      - alert: CauceConsumerLeaseChurn
        expr: changes(cauce_dispatcher_consumer_leases_active[10m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Consumer lease population is churning"
      - alert: CauceOriginRelayFailed
        expr: sum by (lane) (cauce_dispatcher_origin_relay_depth{status="failed"}) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Failed origin relays exist in lane {{ $labels.lane }}"
      - alert: CauceOriginRelayStalled
        expr: max by (lane) (cauce_dispatcher_origin_relay_oldest_seconds{status=~"pending|processing|failed"}) > 300
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Origin relay egress is stalled in lane {{ $labels.lane }}"

  - name: cauce-v3-telegram-progress
    rules:
      - alert: CauceTelegramTargetDown
        expr: absent(up{job="cauce-telegram"}) or up{job="cauce-telegram"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "A discovered Telegram profile is not scrapeable"
      - alert: CauceTelegramPollerStale
        expr: cauce_telegram_pollers_stale > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "One or more Telegram pollers are not progressing"
      - alert: CauceTelegramEgressStale
        expr: cauce_telegram_egress_loop_stale == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Telegram egress claim loop is not progressing"
      - alert: CauceTelegramFencedAck
        expr: increase(cauce_telegram_bridge_events_total{result="egress_fenced"}[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Telegram remote result could not be durably ACKed"
      - alert: CauceTelegramLoopErrors
        expr: increase(cauce_telegram_bridge_events_total{result=~"poll_error|egress_loop_error"}[10m]) >= 3
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Telegram polling or egress is repeatedly failing"

  - name: cauce-v3-wake-outbox
    rules:
      - alert: CauceOutboxMetricsDown
        expr: absent(up{job="cauce-outbox"}) or up{job="cauce-outbox"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Exact wake/outbox metrics endpoint is unavailable"
      - alert: CauceOutboxDatabaseMetricsMissing
        expr: cauce_outbox_query_success == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Outbox exporter cannot collect exact PostgreSQL gauges"
      - alert: CauceReleaseStateMissing
        expr: absent(cauce_release_state_valid) or cauce_release_state_valid != 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Durable release and writer state is absent or invalid"
      - alert: CauceRollbackBridgeDegraded
        expr: cauce_release_rollback_bridge_degraded == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Cauce is running in central-only rollback bridge mode"
      - alert: CauceReleaseWriterCountMismatch
        expr: cauce_release_writers_declared != cauce_release_writers_expected
        labels:
          severity: critical
        annotations:
          summary: "Observed release writers differ from the durable writer snapshot"
      - alert: CauceRollbackBridgeWriterActive
        expr: cauce_release_rollback_bridge_degraded == 1 and cauce_release_writer_leases_active != 0
        labels:
          severity: critical
        annotations:
          summary: "An external writer is active while Cauce is in rollback bridge mode"
      - alert: CauceOutboxDlqClassificationMetricsMissing
        expr: absent(cauce_outbox_dead_letters_open_by_disposition)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Outbox exporter is not publishing schema-030 DLQ classification metrics"
      - alert: CauceWakeOutboxStalled
        expr: max(cauce_outbox_oldest_seconds{kind="wake",status=~"pending|processing|failed"}) > 60
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Adapter wake outbox is stalled"
      - alert: CauceWakeOutboxFailed
        expr: sum(cauce_outbox_depth{kind="wake",status="failed"}) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Failed adapter wake rows are waiting for retry"
      - alert: CauceOriginOutboxStalled
        expr: max(cauce_outbox_oldest_seconds{kind="origin_relay",status=~"pending|processing|failed"}) > 300
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Origin relay outbox is stalled"
      - alert: CauceOriginOutboxDeadLetterNew
        expr: sum(cauce_outbox_dead_letters_new{kind="origin_relay",actionable="true"}) > 0
        labels:
          severity: critical
        annotations:
          summary: "A new actionable origin relay incident exists"
      - alert: CauceWakeOutboxDeadLetterNew
        expr: sum(cauce_outbox_dead_letters_new{kind="wake",actionable="true"}) > 0
        labels:
          severity: warning
        annotations:
          summary: "A new actionable wake incident exists"
      - alert: CauceOutboxDlqUnclassified
        expr: sum(cauce_outbox_dead_letters_open_by_disposition{actionable="true",disposition="unclassified"}) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Outbox incidents remain unclassified; causal reconciliation is not converging"
      - alert: CauceOriginOutboxDlqActionableStale
        expr: max(cauce_outbox_dead_letter_oldest_actionable_seconds{kind="origin_relay"}) > 1800
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "An actionable origin relay incident has remained unresolved for more than 30 minutes"
      - alert: CauceWakeOutboxDlqActionableStale
        expr: max(cauce_outbox_dead_letter_oldest_actionable_seconds{kind="wake"}) > 3600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "An actionable wake incident has remained unresolved for more than one hour"
