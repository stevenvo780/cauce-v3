global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: cauce-v3
    environment: cauce-v3

rule_files:
  - /etc/prometheus/alerts.yaml

scrape_configs:
  - job_name: cauce-dispatcher
    metrics_path: /metrics
    static_configs:
      - targets: [dispatcher:8082]
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8888, otel-collector:9464]
  - job_name: cauce-origin-relay
    metrics_path: /metrics
    static_configs:
      - targets: [relay-worker:8083]
  - job_name: cauce-outbox
    metrics_path: /metrics
    static_configs:
      - targets: [outbox-metrics:8084]
