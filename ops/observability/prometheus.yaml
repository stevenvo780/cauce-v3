global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: cauce-v3
    environment: cauce-v3

rule_files:
  - /etc/prometheus/alerts.yaml

scrape_configs:
  - job_name: cauce-prometheus
    static_configs:
      - targets: [127.0.0.1:9090]
  - job_name: cauce-dispatcher
    metrics_path: /metrics
    static_configs:
      - targets: [dispatcher:8082]
  - job_name: cauce-gateway
    metrics_path: /metrics
    static_configs:
      - targets: [gateway:8081]
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8888, otel-collector:9464]
  - job_name: cauce-telegram
    metrics_path: /metrics
    # Profile-aware discovery: sin registro DNS no hay target rojo fantasma. telegram-bridge binds only its internal backend
    # interface; no host port is published.
    dns_sd_configs:
      - names: [telegram-bridge]
        type: A
        port: 8086
        refresh_interval: 15s
  - job_name: cauce-relay
    metrics_path: /metrics
    # Profile-aware discovery, like cauce-telegram: sin registro DNS no hay target rojo fantasma.
    # terminal-relay is `profiles: [terminal]`, so on a stack without the PTY channel the name does
    # not resolve, no target exists, and the cauce-v3-terminal rules stay silent instead of paging.
    dns_sd_configs:
      - names: [terminal-relay]
        type: A
        port: 8085
        refresh_interval: 15s
  - job_name: cauce-outbox
    metrics_path: /metrics
    static_configs:
      - targets: [outbox-metrics:8084]
