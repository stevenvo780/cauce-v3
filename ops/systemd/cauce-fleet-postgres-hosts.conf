# Drop-in for cauce-fleet-v35-controller.service and cauce-fleet-signed-authority.service
# (/etc/systemd/system/<unit>.d/20-postgres-hosts.conf): refresh Postgres's IP before starting.
# The "+" runs the script outside the unit's sandbox (ProtectSystem, PrivateMounts) so it can
# write /etc and talk to Docker.
[Unit]
After=docker.service
Wants=docker.service

[Service]
ExecStartPre=+/usr/local/sbin/cauce-fleet-postgres-hosts
TimeoutStartSec=180
