# /etc/tmpfiles.d/cauce-fleet-v35-controller.conf
# The gateway mounts /run/cauce-fleet-v35/auth with create_host_path:false. After a reboot /run is
# empty and Docker starts the gateway before the controller creates it, so it must exist from boot.
# Same owner and mode as the controller unit's ExecStartPre (gid 1000 = gateway).
d /run/cauce-fleet-v35 0755 root root -
d /run/cauce-fleet-v35/auth 0750 root 1000 -
d /run/cauce-fleet-v35/authority 0700 root root -
